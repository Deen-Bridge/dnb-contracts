[package]
name = "deenbridge-giving-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "DeenBridge On-Chain Giving — non-custodial USDC escrow for scholarships and community events on Soroban."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
